      <section class="panel ann-compose hidden" id="annCompose">
        <div class="panel-head"><div><span class="mini-label">BUREAU</span><h2 id="annFormTitle">Nouvelle annonce</h2></div></div>
        <form id="annForm" class="form-stack">
          <input type="hidden" id="annId">
          <label>Titre<input id="annTitle" required maxlength="140" placeholder="Déplacement à Sfax : départ 7h"></label>
          <label>Message<textarea id="annBody" required rows="4" maxlength="4000" placeholder="Toutes les informations utiles…"></textarea></label>
          <label class="ann-pin"><input type="checkbox" id="annPinned"> Épingler en haut</label>
          <div class="form-actions"><button type="button" class="btn secondary hidden" id="annCancel">Annuler</button><button class="btn primary" type="submit">Publier</button></div>
        </form>
      </section>
      <section class="ann-list" id="annList"><div class="loading-state">Chargement…</div></section>
