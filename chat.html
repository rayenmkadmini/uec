<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<body data-page="chat">
<div class="app">
  <aside class="sidebar">
    <div class="side-brand"><img src="assets/uec-logo-192.webp"><div><b>UE Clubiste</b><small>Espace Abonné</small></div></div>
    <nav aria-label="Navigation espace membre"><a href="subscriber.html#accueil" data-view-link="accueil"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 11L12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/></svg> <span>Accueil</span></a><a href="subscriber.html#carte" data-view-link="carte"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><circle cx="8.5" cy="11" r="2"/><path d="M5.5 16c.6-1.4 1.7-2.1 3-2.1s2.4.7 3 2.1M14 10h4.5M14 13.5h3"/></svg> <span>Ma carte</span></a><a href="subscriber.html#profil" data-view-link="profil"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.5 2.8-5.8 7-5.8s7 2.3 7 5.8"/></svg> <span>Mon profil</span></a><a href="matchs.html" data-view-link="matchs"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 8.2l3.4 2.5-1.3 4h-4.2l-1.3-4z"/><path d="M12 8.2V4.6M15.4 10.7l3.3-1.4M13.1 14.7l1.9 3.1M8.9 14.7L7 17.8M8.6 10.7L5.3 9.3"/></svg> <span>Matchs</span></a><a href="subscriber.html#evenements" data-view-link="evenements"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M9 15l2 2 4-4"/></svg> <span>Événements</span></a><a href="subscriber.html#reunions" data-view-link="reunions"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10.5l5-3v9l-5-3"/></svg> <span>Réunions</span></a><a href="annonces.html" data-view-link="annonces"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10v4a1 1 0 001 1h2l5 4V5L6 9H4a1 1 0 00-1 1z"/><path d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/></svg> <span>Annonces</span></a><a class="active" href="chat.html" data-view-link="chat"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 01-11.8 7L4 20l1.1-3.9A8 8 0 1120 12z"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01"/></svg> <span>Discussion</span></a></nav>
    <button id="logoutBtn" class="side-logout">↪ Déconnexion</button>
  </aside>
  <div class="main">
    <header class="topbar"><button class="menu-btn" id="menuBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><div><span class="top-kicker">COMMUNAUTÉ</span><h1>Discussion</h1></div><div class="top-user"><div class="avatar" id="avatar">U</div><span id="userName">Utilisateur</span></div></header>
    <main class="content">
      <div id="pageAlert"></div>
      <section class="chat-shell">
        <div class="chat-tabs" role="tablist" id="chatTabs">
          <button type="button" class="chat-tab active" data-channel="GENERAL" role="tab" aria-selected="true"># général</button>
          <button type="button" class="chat-tab" data-channel="BUREAU" role="tab" aria-selected="false" hidden># bureau</button>
          <span class="chat-online" id="chatOnline"><i></i> en ligne</span>
        </div>
        <div class="chat-list" id="chatList" aria-live="polite"><div class="loading-state">Chargement des messages…</div></div>
        <button type="button" class="chat-newer hidden" id="chatNewer">Nouveaux messages ↓</button>
        <form class="chat-form" id="chatForm" autocomplete="off">
          <textarea id="chatInput" rows="1" maxlength="1000" placeholder="Écrire un message…" aria-label="Message"></textarea>
          <button type="submit" class="chat-send" aria-label="Envoyer"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.4 20.4l17.4-7.5a1 1 0 000-1.8L3.4 3.6a1 1 0 00-1.4 1.1L4 11l9 1-9 1-2 6.3a1 1 0 001.4 1.1z"/></svg></button>
        </form>
        <p class="chat-rules">Restez respectueux · les messages sont visibles par tous les membres · le bureau peut retirer un message.</p>
      </section>
    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js" integrity="sha384-WgXwGL6fUsYJWNaKJgVbrJKGRQwc1vieh2oy4kw9nXqpNDz3tdSsqEYUgeHD/NuF" crossorigin="anonymous"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.all.min.js" integrity="sha384-nLoOnA/BDh8A/jxqtckg4DumuCGOBYUnNJLZdQz/zfYNp3wcjGSoWTAzgko06G/2" crossorigin="anonymous"></script>
<script src="js/config.js"></script><script src="js/permissions.js"></script><script src="js/common.js"></script><script src="js/chat.js"></script>
</body></html>
