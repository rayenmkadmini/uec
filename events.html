24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 9L12 4.5 21.5 9 12 13.5 2.5 9z"/><path d="M6.5 11v4.2c0 1.4 2.4 2.8 5.5 2.8s5.5-1.4 5.5-2.8V11"/><path d="M21.5 9v5.5"/></svg> <span>Facultés</span></a><a href="zones.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.1 7-11.5A7 7 0 105 9.5C5 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg> <span>Zones</span></a></nav><button id="logoutBtn" class="side-logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 4H18a2 2 0 012 2v12a2 2 0 01-2 2h-4.5"/><path d="M3 12h11.5"/><path d="M11 8l4 4-4 4"/></svg> Déconnexion</button></aside><div class="main"><header class="topbar"><button class="menu-btn" id="menuBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><div><span class="top-kicker">ADMINISTRATION</span><h1>Événements</h1></div></header><main class="content">
<div id="pageAlert"></div>
<section class="mt-stats" id="evStats"></section>
<section class="panel"><div class="panel-head"><div><span class="mini-label">VIE DU GROUPE</span><h2>Événements</h2></div><button id="addEvent" class="btn primary" type="button">+ Nouvel événement</button></div>
<div class="mt-tabs" role="tablist"><button type="button" class="mt-tab active" data-tab="upcoming">À venir</button><button type="button" class="mt-tab" data-tab="past">Passés</button></div>
<div class="mt-list" id="evList"></div></section>
</main></div></div>
<div id="evModal" class="modal hidden"><div class="modal-box"><div class="modal-head"><h2 id="evTitle">Nouvel événement</h2><button class="close" id="evClose" type="button" aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
<form id="evForm" class="form-stack"><input type="hidden" id="evId">
<label>Titre<input id="evName" required maxlength="140" placeholder="Rassemblement avant le derby"></label>
<div class="mt-row"><label>Catégorie<select id="evCategory"><option value="RASSEMBLEMENT">Rassemblement</option><option value="DEPLACEMENT">Déplacement</option><option value="TIFO">Préparation tifo</option><option value="REUNION">Réunion en présentiel</option><option value="SOIREE">Soirée / social</option><option value="FORMATION">Formation</option><option value="AUTRE">Autre</option></select></label><label>Places (facultatif)<input id="evCapacity" type="number" min="1" placeholder="Illimité"></label></div>
<label>Lieu<input id="evLocation" maxlength="200" placeholder="Stade Olympique de Radès, porte 5"></label>
<div class="mt-row"><label>Date<input id="evDate" type="date" required></label><label>Heure<input id="evTime" type="time" required></label></div>
<div class="mt-row"><label>Durée (min)<input id="evDuration" type="number" min="10" max="2880" value="120" required></label><label>Retard après (min)<input id="evLate" type="number" min="0" max="240" value="15" required></label></div>
<label>Participants<select id="evAudience"><option value="ALL">Tous les membres</option><option value="BUREAU">Bureau uniquement</option><option value="FACULTY">Une faculté</option><option value="ZONE">Une zone</option><option value="CUSTOM">Sélection de personnes</option></select></label>
<label id="evRefWrap" hidden><span id="evRefLabel">Faculté</span><select id="evRef"></select></label>
<div id="evPickWrap" hidden><input id="evPickSearch" class="search" placeholder="Rechercher une personne…"><div class="mt-pick" id="evPick"></div></div>
<label>Photo / affiche <span class="field-optional">Facultatif</span><input id="evPhoto" type="file" accept="image/jpeg,image/png,image/webp"></label>
<div class="ann-photo-preview hidden" id="evPhotoPreview"><img alt=""><button type="button" class="btn secondary" id="evPhotoRemove">Retirer la photo</button></div>
<label>Description<textarea id="evDesc" rows="3" maxlength="2000" placeholder="Programme, consignes, tenue…"></textarea></label>
<button class="btn primary" type="submit">Enregistrer</button></form></div></div>
<div id="evDetail" class="modal hidden"><div class="modal-box"><div class="modal-head"><h2 id="evDetailTitle">Présences</h2><button class="close" id="evDetailClose" type="button" aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div id="evDetailBody"></div></div></div>
<div id="evCodeScreen" class="ev-code-screen hidden" role="dialog" aria-modal="true" aria-label="Code de pointage"><button type="button" class="ev-code-close" id="evCodeClose" aria-label="Fermer">✕</button><small id="evCodeEvent"></small><span>Code de pointage</span><b id="evCodeValue">------</b><p>Ouvrez l’app UEC21 → Mes événements → « Pointer ma présence » et tapez ce code.</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js" integrity="sha384-WgXwGL6fUsYJWNaKJgVbrJKGRQwc1vieh2oy4kw9nXqpNDz3tdSsqEYUgeHD/NuF" crossorigin="anonymous"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.all.min.js" integrity="sha384-nLoOnA/BDh8A/jxqtckg4DumuCGOBYUnNJLZdQz/zfYNp3wcjGSoWTAzgko06G/2" crossorigin="anonymous"></script><script src="js/config.js"></script><script src="js/permissions.js"></script><script src="js/common.js"></script><script src="js/events.js"></script></body></html>
