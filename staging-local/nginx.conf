# Local staging gateway: the ONLY published container, bound to 127.0.0.1 by
# stack.sh. Mirrors the Supabase URL layout (/rest/v1, /auth/v1, /storage/v1,
# /functions/v1) for the services on the private Docker network.
worker_processes 1;
events { worker_connections 256; }

http {
  client_max_body_size 10m;
  resolver 127.0.0.11 valid=10s;
  access_log off;

  # Browser test site only. Upstream CORS headers are replaced so no header is duplicated.
  map $http_origin $cors_origin {
    default "";
    "http://127.0.0.1:5500" $http_origin;
    "http://localhost:5500" $http_origin;
  }

  server {
    listen 8000;

    set $rest      http://ue-stage-rest:3000;
    set $auth      http://ue-stage-auth:9999;
    set $storage   http://ue-stage-storage:5000;
    set $functions http://ue-stage-functions:9000;

    location /rest/v1/ {
      if ($request_method = OPTIONS) { add_header Access-Control-Allow-Origin $cors_origin always; add_header Access-Control-Allow-Headers "authorization, apikey, content-type, prefer, range, x-client-info, accept-profile, content-profile, x-supabase-api-version" always; add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always; add_header Access-Control-Expose-Headers "content-range" always; return 204; }
      proxy_hide_header Access-Control-Allow-Origin;
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Access-Control-Expose-Headers "content-range" always;
      rewrite ^/rest/v1/(.*)$ /$1 break;
      proxy_pass $rest;
    }

    location /auth/v1/ {
      if ($request_method = OPTIONS) { add_header Access-Control-Allow-Origin $cors_origin always; add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, x-supabase-api-version" always; add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always; return 204; }
      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Credentials;
      add_header Access-Control-Allow-Origin $cors_origin always;
      rewrite ^/auth/v1/(.*)$ /$1 break;
      proxy_pass $auth;
    }

    location /storage/v1/ {
      if ($request_method = OPTIONS) { add_header Access-Control-Allow-Origin $cors_origin always; add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, x-upsert, cache-control" always; add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always; return 204; }
      proxy_hide_header Access-Control-Allow-Origin;
      add_header Access-Control-Allow-Origin $cors_origin always;
      rewrite ^/storage/v1/(.*)$ /$1 break;
      proxy_pass $storage;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Prefix /storage/v1;
    }

    # Edge Functions answer CORS themselves (allow-list in _shared/security.ts).
    location /functions/v1/ {
      rewrite ^/functions/v1/(.*)$ /$1 break;
      proxy_pass $functions;
      proxy_read_timeout 120s;
    }

    location / { return 404; }
  }
}
