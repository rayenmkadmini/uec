<!doctype html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>UE Clubiste — Nouveau mot de passe</title>
	<link rel="icon" type="image/png" href="assets/favicon-64.png"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
	<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
	<main class="auth-shell">
		<section class="auth-brand">
			<div class="brand-mark"><img src="assets/uec-logo-192.webp" alt="UE Clubiste"></div>
			<span class="eyebrow">PREMIÈRE CONNEXION</span>
			<h1>Sécurisez<br><strong>votre compte</strong></h1>
			<p>Pour votre sécurité, votre mot de passe initial doit être remplacé.</p>
		</section>
		<section class="auth-card">
			<div class="mobile-logo"><img src="assets/uec-logo-192.webp" alt="UE Clubiste"></div>
			<div class="card-head">
				<span class="mini-label">SÉCURITÉ</span>
				<h2>Nouveau mot de passe</h2>
				<p>Choisissez un mot de passe d’au moins 12 caractères.</p>
			</div>
			<div id="linkError" class="alert error hidden" role="alert"></div>
			<form id="changeForm" class="form-stack">
				<label>Nouveau mot de passe<input id="p1" type="password" minlength="12" autocomplete="new-password" required></label>
				<label>Confirmer le mot de passe<input id="p2" type="password" minlength="12" autocomplete="new-password" required></label>
				<div id="alert" aria-live="polite"></div>
				<button class="btn primary full" type="submit">Enregistrer <span>→</span></button>
			</form>
			<div class="auth-footer"><button id="logoutBtn" class="link-btn" type="button">Déconnexion</button></div>
		</section>
	</main>
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js" integrity="sha384-WgXwGL6fUsYJWNaKJgVbrJKGRQwc1vieh2oy4kw9nXqpNDz3tdSsqEYUgeHD/NuF" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.all.min.js" integrity="sha384-nLoOnA/BDh8A/jxqtckg4DumuCGOBYUnNJLZdQz/zfYNp3wcjGSoWTAzgko06G/2" crossorigin="anonymous"></script>
	<script src="js/config.js"></script>
	<script src="js/permissions.js"></script><script src="js/common.js"></script>
	<script src="js/change-password.js"></script>
</body>
</html>
